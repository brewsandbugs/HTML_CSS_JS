<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page with ATTITUDE</title>
  <link rel="stylesheet" href="style.css">
  <!-- Canvas Confetti Library for Strong Passwords -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="login-card" id="card">
    <div class="avatar" id="avatar">🤨</div>
    <h2>Identify Yourself</h2>
    
    <div class="input-group">
      <input type="email" id="email" placeholder="Email address" autocomplete="off">
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
    </div>

    <div class="roast-message" id="roast">Type something... if you dare.</div>

    <button id="loginBtn">LOG IN</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
