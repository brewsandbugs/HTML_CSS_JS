<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Lamp Login UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            background-color: #0b0f19;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10%;
            transition: background-color 0.8s ease;
        }

        /* Ambient Room Lighting Cone from the Right Lamp */
        .room-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 85% 45%, rgba(255, 215, 120, 0.22) 0%, rgba(11, 15, 25, 0.96) 65%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index: 1;
        }

        body.light-on {
            background-color: #141a29;
        }

        body.light-on .room-overlay {
            opacity: 1;
        }

        /* Login Card Container */
        .login-card {
            position: relative;
            z-index: 5;
            background: rgba(22, 28, 45, 0.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 45px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateX(-30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.light-on .login-card {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .login-card h2 {
            color: #f7fafc;
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }

        .form-actions a {
            color: #818cf8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-actions a:hover {
            color: #a5b4fc;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* Hint text */
        .hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #64748b;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: opacity 0.5s ease;
            z-index: 5;
            pointer-events: none;
        }

        body.light-on .hint {
            opacity: 0;
        }

        /* Standing Floor Lamp on the Right */
        .floor-lamp {
            position: relative;
            width: 120px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }

        /* Long Pole extending from floor up */
        .lamp-pole {
            position: absolute;
            bottom: 0;
            width: 6px;
            height: 75vh;
            background: linear-gradient(90deg, #334155, #64748b, #334155);
            border-radius: 3px;
        }

        /* Lamp Head / Shade */
        .lamp-shade {
            position: absolute;
            top: calc(25vh - 35px);
            width: 140px;
            height: 80px;
            background: linear-gradient(135deg, #334155, #1e293b);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            border-bottom: 4px solid #94a3b8;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
        }

        .bulb {
            width: 30px;
            height: 20px;
            background: #475569;
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        body.light-on .bulb {
            background: #fffbeb;
            box-shadow: 0 0 30px #fde047, 0 0 60px #eab308, inset 0 0 10px #ffffff;
        }

        /* Pull Chain Mechanism */
        .pull-chain-container {
            position: absolute;
            top: calc(25vh + 40px);
            right: 50px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pull-chain {
            width: 2px;
            height: 70px;
            background: #94a3b8;
            transform-origin: top center;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .pull-ring {
            width: 14px;
            height: 18px;
            border: 2px solid #94a3b8;
            border-radius: 50%;
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 15, 25, 0.3);
        }

        .pull-chain.pulling {
            transform: scaleY(1.3);
        }
    </style>
</head>
<body>

    <div class="room-overlay"></div>

    <div class="hint">Pull the lamp chain to log in</div>

    <!-- Login Form Component -->
    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access your workspace.</p>
        <form onsubmit="event.preventDefault(); alert('Signed in successfully!');">
            <div class="input-group">
                <input type="email" placeholder="Username or Email" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>
            <div class="form-actions">
                <label style="color: #94a3b8; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" style="accent-color: #6366f1;"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
    </div>

    <!-- Standing Floor Lamp (Right Side) -->
    <div class="floor-lamp" id="lampToggle">
        <div class="lamp-pole"></div>
        <div class="lamp-shade">
            <div class="bulb"></div>
        </div>
        <div class="pull-chain-container">
            <div class="pull-chain" id="pullChain">
                <div class="pull-ring"></div>
            </div>
        </div>
    </div>

    <script>
        const lamptoggle = document.getElementById("lampToggle");
        const pullChain = document.getElementById("pullChain");
        const body = document.body;

        lamptoggle.addEventListener('click', () => {
            //pull animation feedback
            pullChain.classList.add('pulling');
            setTimeout(() => {
                pullChain.classList.remove('pulling');
            }, 300)

            // Turn the room light and toggle login card
            body.classList.toggle('light-on');
        })
    </script>
</body>
</html>
